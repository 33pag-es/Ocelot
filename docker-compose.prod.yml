# Production tracker server.
#
# Ocelot runs on its own server and reaches the Gazelle site server over a
# WireGuard tunnel: MySQL at MYSQL_HOST:3306 and Gazelle's freeleech-token
# callback at GAZELLE_HOST:GAZELLE_PORT. Gazelle calls Ocelot back on
# TRACKER_TUNNEL_IP:34000. Caddy on this host serves the public announce URL
# and proxies to TRACKER_BIND:34000 (docker/Caddyfile.example).
#
#   cp .env.example .env    # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Docker-published ports bypass host firewalls such as ufw, so never bind
# these to a public address. Docker must start after wg-quick@wg0 (see
# README): a port bound to a missing address fails and is not retried.
name: ocelot-prod

services:
  ocelot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OCELOT_IMAGE:-ocelot:prod}
    restart: unless-stopped
    ports:
      # Caddy on this host.
      - ${TRACKER_BIND:-127.0.0.1}:34000:34000
      # Gazelle on the site server, over WireGuard only.
      - ${TRACKER_TUNNEL_IP:-10.33.0.2}:34000:34000
    volumes:
      - ./docker/ocelot.prod.conf.template:/srv/ocelot.conf.template:ro
      - ./docker/entrypoint-prod.sh:/srv/entrypoint-prod.sh:ro
    tmpfs:
      - /tmp/ocelot
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/srv/entrypoint-prod.sh"]
